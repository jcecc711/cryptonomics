<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Portfolio">
<title>Investor Portal</title>
<script src="https://cdn.jsdelivr.net/npm/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root {
  --bg: #f5f6fa; --panel: #fff; --text: #141824; --muted: #6b7385; --line: #e6e8ef; --chip: #eef0f6;
  --good: #12a150; --bad: #e5484d; --accent: #6d4aff; --btc: #f7931a;
  --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 16px rgba(16,24,40,.05);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0d0f15; --panel: #151821; --text: #e8eaf0; --muted: #9098aa; --line: #262b38; --chip: #1f2430; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  padding: max(16px, env(safe-area-inset-top)) 16px 32px; }
.wrap { max-width: 1080px; margin: 0 auto; }
header { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.logo { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: #fff; font-weight: 900; font-size: 20px;
  background: linear-gradient(135deg, var(--btc), #12a150); flex: none; }
header h1 { font-size: 18px; margin: 0; } header .sub { color: var(--muted); font-size: 13px; }
header .sp { flex: 1; }
.badge { font-size: 11px; font-weight: 800; letter-spacing: .04em; padding: 4px 8px; border-radius: 6px; background: #fff4e5; color: #b25e00; border: 1px solid #f5c27a; white-space: nowrap; }
.iconbtn { width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); display: grid; place-items: center; cursor: pointer; flex: none; }
.iconbtn svg { width: 18px; height: 18px; } .iconbtn.spin svg { animation: sp .8s linear infinite; } @keyframes sp { to { transform: rotate(360deg); } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow); padding: 16px 18px; margin-bottom: 16px; }
.panel h2 { font-size: 15px; margin: 0 0 12px; }
.hero { color: #fff; border: 0; background: linear-gradient(120deg, var(--btc) 0%, #f5b041 35%, #12a150 100%); display: grid;
  grid-template-columns: 1.3fr 1fr 1fr; gap: 14px 24px; align-items: end; }
.hero.down { background: linear-gradient(120deg, var(--btc) 0%, var(--bad) 100%); }
.hero .t { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; opacity: .92; }
.hero .v { font-size: 34px; font-weight: 900; line-height: 1.1; } .hero .v2 { font-size: 24px; font-weight: 800; line-height: 1.15; }
.hero .chg { font-size: 16px; font-weight: 700; white-space: nowrap; } .hero .s { font-size: 13px; opacity: .95; }
.periods { display: grid; grid-template-columns: repeat(6, 1fr); gap: 10px; }
.period { border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.period .k { color: var(--muted); font-size: 12px; font-weight: 700; } .period .r { font-size: 18px; font-weight: 800; } .period .d { font-size: 12px; color: var(--muted); }
.good { color: var(--good); } .bad { color: var(--bad); }
.alloc { height: 12px; border-radius: 6px; background: var(--chip); overflow: hidden; display: flex; margin: 8px 0 6px; }
.alloc i { display: block; background: var(--btc); } .alloc b { display: block; background: #3b82f6; }
.legend { display: flex; gap: 16px; color: var(--muted); font-size: 13px; flex-wrap: wrap; } .dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 5px; vertical-align: -1px; }
#chart { height: 280px; } .chart-empty { color: var(--muted); padding: 40px 0; text-align: center; }
table { width: 100%; border-collapse: collapse; } th, td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; } .n { text-align: right; font-variant-numeric: tabular-nums; }
.tw { overflow-x: auto; } a { color: var(--accent); font-weight: 700; text-decoration: none; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; } .grid2 .panel { margin: 0; }
.note { color: var(--muted); font-size: 12px; } .empty { color: var(--muted); padding: 30px 0; text-align: center; }
.err { color: var(--bad); }
@media (max-width: 820px) { .hero { grid-template-columns: 1fr 1fr; } .hero .main { grid-column: 1 / 3; } .periods { grid-template-columns: repeat(3, 1fr); } .grid2 { grid-template-columns: 1fr; } }
@media (max-width: 420px) { .hero .v { font-size: 30px; } .hero .v2 { font-size: 20px; } .periods { grid-template-columns: repeat(2, 1fr); } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="i-refresh" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 4v5h-5"/></symbol></svg>
<div class="wrap">
  <header>
    <div class="logo">₿</div>
    <div><h1 id="name">Investor portal</h1><div class="sub" id="sub">Cryptonomics</div></div>
    <div class="sp"></div>
    <span class="badge" id="mode">SIMULATED ACCOUNT</span>
    <button class="iconbtn" id="reload" title="Refresh" aria-label="Refresh"><svg><use href="#i-refresh"/></svg></button>
  </header>
  <div id="app"><div class="panel empty">Loading your account…</div></div>
  <p class="note">Simulated (paper) account: no real money is invested and results are hypothetical. Trades are simulated against the live Binance.US order book.
    Past or simulated performance does not guarantee future results.</p>
</div>
<script>
const $ = s => document.querySelector(s);
const qs = new URLSearchParams(location.search), who = qs.get("client");   // the admin viewing a client
const api = async p => { const r = await fetch(p + (who ? (p.includes("?") ? "&" : "?") + "client=" + encodeURIComponent(who) : ""), {cache: "no-store"});
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.statusText); return r.json(); };
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const usd = (x, d = 2) => (x < 0 ? "-$" : "$") + Math.abs(x).toLocaleString(undefined, {minimumFractionDigits: d, maximumFractionDigits: d});
const sgnUsd = (x, d = 2) => (x >= 0 ? "+" : "−") + usd(Math.abs(x), d);
const pct = (x, d = 2) => (x >= 0 ? "+" : "−") + Math.abs(100 * x).toFixed(d) + "%";
const cls = x => x >= 0 ? "good" : "bad";
const monthName = m => new Date(m + "-01T00:00:00Z").toLocaleDateString(undefined, {month: "long", year: "numeric", timeZone: "UTC"});
const dateFmt = s => new Date(s.replace(" ", "T") + (s.length > 10 ? "Z" : "T00:00:00Z")).toLocaleDateString(undefined, {month: "short", day: "numeric", year: "numeric"});
let chart = null;

async function load() {
  try { render(await api("api/me")); }
  catch (e) { $("#app").innerHTML = `<div class="panel err">Couldn't load the account: ${esc(e.message)}</div>`; }
}
function render(r) {
  document.title = r.name + " · Investor Portal";
  $("#name").textContent = r.name;
  $("#sub").textContent = `Account ${r.id} · since ${dateFmt(r.inception)} · starting capital ${usd(r.start_usd, 0)}`;
  $("#mode").textContent = r.mode === "paper" ? "SIMULATED ACCOUNT" : "LIVE ACCOUNT";
  const stmt = m => `statement?month=${m}${who ? "&client=" + encodeURIComponent(who) : ""}`;
  const btcCh = r.btc_equiv - r.btc_equiv_start, btcPct = r.btc_equiv / r.btc_equiv_start - 1, inBtc = Math.round(100 * r.in_btc);
  $("#app").innerHTML = `
  <div class="panel hero ${r.gain >= 0 ? "" : "down"}">
    <div class="main"><div class="t">Account value</div><div class="v">${usd(r.value)} <span class="chg">(${sgnUsd(r.gain)})</span></div>
      <div class="s">${pct(r.ret)} since inception · holding BTC instead: ${pct(r.hold_ret)}</div></div>
    <div><div class="t">BTC equivalent</div><div class="v2">${r.btc_equiv.toFixed(5)} BTC <span class="chg">(${(btcCh >= 0 ? "+" : "−") + Math.abs(btcCh).toFixed(5)})</span></div>
      <div class="s">${pct(btcPct, 1)} vs ${r.btc_equiv_start.toFixed(5)} at the start</div></div>
    <div><div class="t">Bitcoin price</div><div class="v2">${usd(r.price, 0)}</div><div class="s">${pct(r.price / r.price0 - 1, 1)} since inception</div></div>
  </div>
  <div class="panel"><h2>Performance</h2><div class="periods">${r.periods.map(p => `<div class="period"><div class="k">${esc(p.label)}</div>
    <div class="r ${cls(p.ret)}">${pct(p.ret)}</div><div class="d">${sgnUsd(p.gain, 0)}${p.since_inception && p.label !== "Since inception" ? " · since inception" : ""}</div></div>`).join("")}</div></div>
  <div class="panel"><h2>Account value over time</h2><div id="chart"></div>
    <div class="legend"><span><i class="dot" style="background:#6d4aff"></i>Your account</span><span><i class="dot" style="background:#f7931a"></i>Starting capital held in BTC</span></div></div>
  <div class="grid2">
    <div class="panel"><h2>Allocation</h2>
      <div class="alloc"><i style="width:${inBtc}%"></i><b style="width:${100 - inBtc}%"></b></div>
      <div class="legend"><span><i class="dot" style="background:#f7931a"></i>Bitcoin ${inBtc}% · ${r.btc.toFixed(5)} BTC · ${usd(r.btc * r.price)}</span>
        <span><i class="dot" style="background:#3b82f6"></i>Cash ${100 - inBtc}% · ${usd(r.cash)}</span></div>
      <p class="note">The strategy holds Bitcoin when its trend signals are up across 4h, 8h, 12h and daily timeframes, and cash otherwise.</p></div>
    <div class="panel"><h2>Monthly statements</h2><div class="tw"><table><thead><tr><th>Month</th><th class="n">Return</th><th class="n">Gain / loss</th><th class="n">End value</th><th></th></tr></thead><tbody>
      ${r.months.map(m => `<tr><td>${monthName(m.month)}</td><td class="n ${cls(m.ret)}">${pct(m.ret)}</td><td class="n ${cls(m.gain)}">${sgnUsd(m.gain)}</td>
        <td class="n">${usd(m.end_value)}</td><td class="n"><a href="${stmt(m.month)}" target="_blank" rel="noopener">Statement</a></td></tr>`).join("")}</tbody></table></div></div>
  </div>
  <div class="panel" style="margin-top:16px"><h2>Trades</h2>${r.trades.length ? `<div class="tw"><table><thead><tr><th>Bought (UTC)</th><th class="n">Price</th><th class="n">BTC</th><th>Sold (UTC)</th><th class="n">Price</th><th class="n">Return</th></tr></thead><tbody>
    ${r.trades.slice(0, 50).map(t => `<tr><td>${esc(t.entry_time.slice(0, 16))}</td><td class="n">${usd(t.entry_price, 0)}</td><td class="n">${t.qty.toFixed(5)}</td>
      <td>${t.exit_time ? esc(t.exit_time.slice(0, 16)) : "<b>open</b>"}</td><td class="n">${t.exit_price ? usd(t.exit_price, 0) : usd(r.price, 0)}</td>
      <td class="n ${cls(t.ret ?? (r.price / t.entry_price - 1))}">${pct(t.ret ?? (r.price / t.entry_price - 1))}${t.exit_time ? "" : " (open)"}</td></tr>`).join("")}</tbody></table></div>`
    : `<div class="empty">No trades yet. The strategy is waiting for its next buy signal and the account is in cash.</div>`}</div>`;
  drawChart(r);
}
function drawChart(r) {
  const el = $("#chart");
  if (r.equity.length < 2) { el.innerHTML = '<div class="chart-empty">The chart fills in as the account is recorded each hour; check back in a day or two.</div>'; return; }
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  chart = LightweightCharts.createChart(el, {autoSize: true, layout: {background: {color: "transparent"}, textColor: dark ? "#9098aa" : "#6b7385"},
    grid: {vertLines: {visible: false}, horzLines: {color: dark ? "#1f2430" : "#eef0f5"}}, rightPriceScale: {borderVisible: false}, timeScale: {borderVisible: false},
    handleScroll: false, handleScale: false});
  const fmt = {type: "custom", formatter: v => usd(v, 0)};
  chart.addLineSeries({color: "#f7931a", lineWidth: 2, priceFormat: fmt, lastValueVisible: false, priceLineVisible: false}).setData(r.equity.map(e => ({time: e.t, value: e.hold})));
  chart.addAreaSeries({lineColor: "#6d4aff", topColor: "rgba(109,74,255,.25)", bottomColor: "rgba(109,74,255,0)", lineWidth: 2, priceFormat: fmt}).setData(r.equity.map(e => ({time: e.t, value: e.v})));
  chart.timeScale().fitContent();
}
$("#reload").onclick = () => { $("#reload").classList.add("spin"); location.reload(); };
load();
</script>
</body>
</html>
