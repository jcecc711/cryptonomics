<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cryptonomics Bot</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1b1f24; --muted: #667080; --line: #e3e6ea;
    --up: #1aa0c8; --down: #d6335a; --adx: #8a8f98; --price: #1b1f24; --good: #1f9d55; --bad: #d6335a;
    --accent: #3451b2; --chip: #eef1f5;
    --badge-paper: #e9eefc; --badge-paper-text: #3451b2; --badge-live: #fde8ec; --badge-live-text: #b4233f;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1216; --panel: #171b21; --text: #e6e9ee; --muted: #9aa3ae; --line: #262c34;
      --price: #e6e9ee; --accent: #9db1ff; --chip: #212730;
      --badge-paper: #1d2747; --badge-paper-text: #9db1ff; --badge-live: #3a1820; --badge-live-text: #ff9db1;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-bottom: 14px; }
  h1 { font-size: 22px; margin: 0; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .badge { font-size: 12px; font-weight: 600; padding: 3px 8px; border-radius: 999px; letter-spacing: .02em; }
  .paper { background: var(--badge-paper); color: var(--badge-paper-text); }
  .live { background: var(--badge-live); color: var(--badge-live-text); }
  .muted { color: var(--muted); }
  .good { color: var(--good); } .bad { color: var(--bad); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-bottom: 16px; }
  .total { display: flex; flex-wrap: wrap; gap: 8px 28px; align-items: baseline; }
  .total .v { font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .sleeves { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-bottom: 16px; }
  .sleeve { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .sleeve .head { display: flex; justify-content: space-between; align-items: baseline; }
  .sleeve .tf { font-size: 18px; font-weight: 700; }
  .sleeve .pos { font-size: 13px; font-weight: 600; padding: 2px 8px; border-radius: 999px; background: var(--chip); }
  .sleeve .row { display: flex; justify-content: space-between; font-size: 13px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .sleeve .sum { font-size: 13px; color: var(--muted); margin-top: 8px; }
  .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .tabs button { font: inherit; font-size: 13px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line);
                 background: var(--panel); color: var(--text); cursor: pointer; }
  .tabs button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
  .chart { position: relative; height: 280px; }
  .chart.small { height: 190px; }
  .table-wrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  .empty { color: var(--muted); padding: 8px 0; }
  .err { color: var(--bad); }
</style>
</head>
<body>
<main>
  <header>
    <h1>Cryptonomics Bot</h1>
    <span id="mode" class="badge paper">PAPER</span>
    <span id="kill" class="badge live" hidden>KILL SWITCH ON</span>
    <span id="updated" class="muted">Loading…</span>
  </header>

  <section class="panel total">
    <div><div class="muted">Total account</div><div class="v" id="total">–</div></div>
    <div id="total-s" class="muted"></div>
    <div id="exposure" class="muted"></div>
  </section>

  <section class="sleeves" id="sleeves"></section>

  <section class="panel">
    <div class="tabs" id="tabs" role="group" aria-label="Timeframe"></div>
    <h2 id="price-title">BTC close <span class="muted">(▲ buy, ▼ sell)</span></h2>
    <div class="chart"><canvas id="price"></canvas></div>
    <h2 style="margin-top:14px">DI+ / DI- (38) <span class="muted">· dashed: your 11 / 14 / 17 lines</span></h2>
    <div class="chart small"><canvas id="dmi"></canvas></div>
  </section>
  <section class="panel">
    <h2>Account value</h2>
    <div class="chart small"><canvas id="equity"></canvas></div>
  </section>
  <section class="panel">
    <h2>Trades</h2>
    <div class="table-wrap" id="trades"></div>
  </section>
  <section class="panel">
    <h2>Signals</h2>
    <div class="table-wrap" id="signals"></div>
  </section>
  <section class="panel">
    <h2>Orders</h2>
    <div class="table-wrap" id="orders"></div>
  </section>
</main>
<script>
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const usd = (x, d = 0) => x == null ? "–" : "$" + Number(x).toLocaleString(undefined, {minimumFractionDigits: d, maximumFractionDigits: d});
const pct = x => (x >= 0 ? "+" : "") + (x * 100).toFixed(1) + "%";
const cls = x => x >= 0 ? "good" : "bad";
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
const charts = {};
let state = null, selected = null;
try { selected = localStorage.getItem("tf"); } catch (e) {}

function table(el, rows, cols) {
  const box = document.getElementById(el);
  if (!rows.length) { box.innerHTML = '<div class="empty">None yet.</div>'; return; }
  box.innerHTML = "<table><thead><tr>" + cols.map(c => `<th>${c[0]}</th>`).join("") +
    "</tr></thead><tbody>" + rows.map(r => "<tr>" + cols.map(c => `<td>${c[1](r) ?? ""}</td>`).join("") + "</tr>").join("") +
    "</tbody></table>";
}

// Put a marker on the last candle at or before each trade time.
function markers(labels, values, trades, key) {
  const out = labels.map(() => null);
  if (!labels.length) return out;
  trades.forEach(t => {
    if (!t[key]) return;
    const when = t[key].slice(0, labels[0].length);
    if (when < labels[0]) return;
    let i = labels.length - 1;
    while (i >= 0 && labels[i] > when) i--;
    if (i >= 0) out[i] = values[i];
  });
  return out;
}

function draw(id, data, options) {
  if (charts[id]) { charts[id].data = data; charts[id].options = options; charts[id].update(); }
  else charts[id] = new Chart(document.getElementById(id), {type: "line", data, options});
}

function baseOptions(legendFilter) {
  const grid = {color: css("--line")};
  return {responsive: true, maintainAspectRatio: false, animation: false, interaction: {mode: "index", intersect: false},
          scales: {x: {grid, ticks: {color: css("--muted"), maxTicksLimit: 7}}, y: {grid, ticks: {color: css("--muted")}}},
          plugins: {legend: {labels: {color: css("--muted"), boxWidth: 12, ...(legendFilter ? {filter: legendFilter} : {})}}}};
}

const tri = (label, data, color, down) => ({label, data, showLine: false, pointStyle: "triangle", rotation: down ? 180 : 0,
                                             pointRadius: 8, backgroundColor: color, borderColor: color});

function drawTimeframe() {
  const s = state, c = s.chart && s.chart[selected];
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.tf === selected));
  if (!c) return;
  const trades = s.trades.filter(t => t.strategy === selected);
  document.getElementById("price-title").innerHTML =
    `BTC ${selected} close, last ${c.times.length} candles <span class="muted">(▲ buy, ▼ sell)</span>`;
  draw("price", {labels: c.times, datasets: [
    {label: "Close", data: c.close, borderColor: css("--price"), borderWidth: 1.5, pointRadius: 0},
    tri("Buy", markers(c.times, c.close, trades, "entry_time"), css("--good")),
    tri("Sell", markers(c.times, c.close, trades, "exit_time"), css("--bad"), true)]}, baseOptions());
  const level = (v, col) => ({label: String(v), data: c.times.map(() => v), borderColor: col, borderDash: [4, 4], borderWidth: 1, pointRadius: 0});
  draw("dmi", {labels: c.times, datasets: [
    {label: "DI+", data: c.di_plus, borderColor: css("--up"), borderWidth: 2, pointRadius: 0},
    {label: "DI-", data: c.di_minus, borderColor: css("--down"), borderWidth: 2, pointRadius: 0},
    {label: "ADX", data: c.adx, borderColor: css("--adx"), borderWidth: 1, pointRadius: 0},
    level(11, css("--muted")), level(14, css("--down")), level(17, css("--down"))]},
    baseOptions(i => ["DI+", "DI-", "ADX"].includes(i.text)));
}

function sleeveCard(sl, run) {
  const last = sl.last, t = sl.trade, r = run && run.sleeves ? run.sleeves[sl.name] : null;
  const ret = last && sl.start_value ? last.value / sl.start_value - 1 : null;
  const open = t && last ? last.price / t.entry_price - 1 : null;
  return `<div class="sleeve">
    <div class="head"><span class="tf">${sl.name}</span><span class="pos">${t ? "BTC" : "Cash"}</span></div>
    <div class="row"><span class="muted">Value</span><span>${last ? usd(last.value) : "–"}
      ${ret == null ? "" : `<span class="${cls(ret)}">${pct(ret)}</span>`}</span></div>
    <div class="row"><span class="muted">Open trade</span><span>${open == null ? "–" :
      `<span class="${cls(open)}">${pct(open)}</span> from ${usd(t.entry_price)}`}</span></div>
    <div class="sum">${r ? esc(r.summary) + (r.note ? " " + esc(r.note) + "." : "") : "Not run yet."}</div>
  </div>`;
}

const reading = r => {
  const x = JSON.parse(r.readings || "{}");
  return "di_plus" in x ? `DI+ ${x.di_plus.toFixed(1)} / DI- ${x.di_minus.toFixed(1)}` : "";
};

async function refresh() {
  let s;
  try { s = await (await fetch("api/status", {cache: "no-store"})).json(); }
  catch (e) { document.getElementById("updated").innerHTML = '<span class="err">Could not reach the bot.</span>'; return; }
  state = s;

  const mode = document.getElementById("mode");
  mode.textContent = s.mode.toUpperCase(); mode.className = "badge " + (s.mode === "live" ? "live" : "paper");
  document.getElementById("kill").hidden = !s.kill_switch;
  document.getElementById("updated").textContent = s.last_run ? `last run ${s.last_run.time} UTC` :
    "not run yet. Start it with: python -m bot.run loop";
  const eq = s.equity, last = eq.at(-1);
  document.getElementById("total").textContent = last ? usd(last.value) : "–";
  if (last) {
    const r = last.value / eq[0].value - 1;
    document.getElementById("total-s").innerHTML = `<span class="${cls(r)}">${pct(r)}</span> since ${eq[0].ts.slice(0, 10)}`;
    const holding = s.sleeves.filter(x => x.trade).length;
    document.getElementById("exposure").textContent = `${holding} of ${s.sleeves.length} sleeves holding BTC`;
  }
  document.getElementById("sleeves").innerHTML = s.sleeves.map(sl => sleeveCard(sl, s.last_run)).join("");

  const tfs = s.sleeves.map(x => x.name);
  if (!tfs.includes(selected)) selected = tfs[tfs.length - 1];
  const tabs = document.getElementById("tabs");
  if (tabs.children.length !== tfs.length) {
    tabs.innerHTML = tfs.map(tf => `<button type="button" data-tf="${tf}">${tf}</button>`).join("");
    tabs.querySelectorAll("button").forEach(b => b.onclick = () => {
      selected = b.dataset.tf;
      try { localStorage.setItem("tf", selected); } catch (e) {}
      drawTimeframe();
    });
  }
  drawTimeframe();
  draw("equity", {labels: eq.map(e => e.ts.slice(0, 16)), datasets: [
    {label: "Total", data: eq.map(e => e.value), borderColor: css("--up"), backgroundColor: css("--up"), borderWidth: 2,
     pointRadius: eq.length < 2 ? 4 : 0}]},
    {...baseOptions(), plugins: {legend: {display: false}}});

  table("trades", s.trades, [
    ["Sleeve", r => r.strategy], ["Bought", r => r.entry_time.slice(0, 16)], ["At", r => usd(r.entry_price)],
    ["BTC", r => Number(r.qty).toFixed(5)], ["Sold", r => r.exit_time ? r.exit_time.slice(0, 16) : "open"],
    ["At", r => r.exit_price ? usd(r.exit_price) : ""],
    ["Return", r => r.ret == null ? "" : `<span class="${cls(r.ret)}">${pct(r.ret)}</span>`]]);
  const sigs = s.sleeves.flatMap(sl => sl.signals.map(x => ({...x, strategy: sl.name})))
    .sort((a, b) => b.created.localeCompare(a.created)).slice(0, 30);
  table("signals", sigs, [
    ["Sleeve", r => r.strategy], ["Candle", r => r.candle_time.slice(0, 16)], ["Close", r => usd(r.close)],
    ["Reading", reading], ["Action", r => r.action], ["Note", r => esc(r.note)]]);
  table("orders", s.orders, [
    ["Sleeve", r => r.strategy], ["Time", r => r.created], ["Side", r => r.side], ["Type", r => r.type],
    ["Price", r => usd(r.price, 2)], ["Qty", r => Number(r.qty).toFixed(5)], ["Status", r => r.status],
    ["Filled", r => Number(r.filled_qty).toFixed(5)], ["Fee", r => usd(r.commission_usd, 2)]]);
}
refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
